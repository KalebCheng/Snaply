<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<title>Snaply</title>
<!--
  Snaply 应用图标（源文件）。
  构图：深色超椭圆底板（左上带光），银色金属镜环偏左上，镜面里斜穿一道棱镜光。
  几何：1024 画布、824 主体（四周各 100 留白、按 50–90% 缩放居中）、连续圆角（近似 iOS squircle）。
  徽标元素收在超椭圆内切范围内，不超出图标安全区；底部叠一层柔和投影。
-->
<defs>
  <radialGradient id="bg" cx="0.3" cy="0.08" r="1.15">
    <stop offset="0" stop-color="#55596A"/><stop offset="0.45" stop-color="#23252C"/><stop offset="1" stop-color="#0A0B0D"/>
  </radialGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#C2C9D6"/>
    <stop offset="0.55" stop-color="#7A8392"/><stop offset="0.8" stop-color="#E6EAF1"/>
    <stop offset="1" stop-color="#8A93A2"/>
  </linearGradient>
  <linearGradient id="bezelInner" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#000000" stop-opacity="0.45"/><stop offset="0.5" stop-color="#000000" stop-opacity="0.05"/><stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
  </linearGradient>
  <linearGradient id="prism" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7FF0D0"/><stop offset="0.33" stop-color="#8FB6FF"/>
    <stop offset="0.66" stop-color="#C9A0FF"/><stop offset="1" stop-color="#FFB3D9"/>
  </linearGradient>
  <radialGradient id="sheen" cx="0.35" cy="0.22" r="0.75">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="tile"><path d="M25.00 66.30 C25.00 47.71 47.71 25.00 66.30 25.00 L133.70 25.00 C152.28 25.00 175.00 47.71 175.00 66.30 L175.00 133.70 C175.00 152.28 152.28 175.00 133.70 175.00 L66.30 175.00 C47.71 175.00 25.00 152.28 25.00 133.70 L25.00 66.30 Z"/></clipPath>
</defs>
<g transform="translate(512 512) scale(0.86) translate(-512 -512)">
  <g transform="translate(104 112) scale(3.2)" opacity="0.2"><path d="M25.00 66.30 C25.00 47.71 47.71 25.00 66.30 25.00 L133.70 25.00 C152.28 25.00 175.00 47.71 175.00 66.30 L175.00 133.70 C175.00 152.28 152.28 175.00 133.70 175.00 L66.30 175.00 C47.71 175.00 25.00 152.28 25.00 133.70 L25.00 66.30 Z" fill="#000"/></g>
  <!-- */ -->
  <g transform="translate(104 104) scale(3.2)">
    <g clip-path="url(#tile)">
    <path d="M25.00 66.30 C25.00 47.71 47.71 25.00 66.30 25.00 L133.70 25.00 C152.28 25.00 175.00 47.71 175.00 66.30 L175.00 133.70 C175.00 152.28 152.28 175.00 133.70 175.00 L66.30 175.00 C47.71 175.00 25.00 152.28 25.00 133.70 L25.00 66.30 Z" fill="url(#bg)"/>
    <circle cx="128" cy="128" r="96" fill="url(#chrome)"/>
    <circle cx="128" cy="128" r="95" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="128" cy="128" r="74" fill="#16181C"/>
    <circle cx="128" cy="128" r="74" fill="url(#bezelInner)"/>
    <circle cx="128" cy="128" r="74" fill="url(#sheen)"/>
    <g transform="translate(128 128) rotate(-40)"><rect x="-90" y="-3.5" width="180" height="7" rx="3.5" fill="url(#prism)"/></g>

    </g>
  </g>
</g>
</svg>
