<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Snaply</title>
  <!--
    Snaply application icon.
    The mark matches the SnaplyMark used by the About page: capture corners,
    a diagonal capture path, and the arrow tip.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F0"/>
      <stop offset="0.55" stop-color="#FFE9D2"/>
      <stop offset="1" stop-color="#F9CFA6"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF982E"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#D94B05"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.78">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#4A2108" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="192" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="192" fill="url(#sheen)"/>
  <rect x="112" y="112" width="800" height="800" rx="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4"/>

  <g transform="translate(512 512) scale(12) translate(-32 -32)">
    <rect x="9" y="9" width="46" height="46" rx="12" fill="#F97316" opacity="0.1"/>
    <g fill="none" stroke="url(#mark)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.5 21.3V13.5H21.3M42.7 13.5H50.5V21.3M50.5 42.7V50.5H42.7M21.3 50.5H13.5V42.7" stroke-width="4.8"/>
      <path d="M23.4 40.6L36.4 27.6" stroke-width="3.9"/>
    </g>
    <path d="M42.8 21.2L40.8 32L32 23.2Z" fill="url(#mark)"/>
  </g>
</svg>
