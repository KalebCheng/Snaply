[package]
name = "snaply"
version = "0.1.4"
description = "Snaply - cross-platform screenshot & annotation tool"
authors = ["Snaply"]
license = "MIT"
repository = "https://github.com/KalebCheng/Snaply"
edition = "2021"
rust-version = "1.80"

[lib]
name = "snaply_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
xcap = "=0.8.0"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"

# 直接用 objc2 的 CG 绑定：与 tauri / xcap 已经拉进来的版本共用，不额外引入 objc 运行时。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFArray", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGColorSpace", "CGContext", "CGDirectDisplay", "CGEvent", "CGEventTypes", "CGImage", "CGWindow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
