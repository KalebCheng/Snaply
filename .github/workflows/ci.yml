name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Supply chain: third-party actions are referenced by floating major tags for
# readability. Each one can be pinned to a full 40-character commit SHA (for
# example `uses: actions/checkout@<sha> # v7`) to protect against a retagged or
# compromised release. `dtolnay/rust-toolchain@stable` is a branch by design and
# only selects a stable toolchain.

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        # The pnpm version comes from the `packageManager` field in
        # package.json; passing `version` here as well makes the action fail
        # with "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  checks:
    name: Check (${{ matrix.name }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows x64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
          - name: Linux x64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libx11-dev libxcb1-dev libdbus-1-dev libpipewire-0.3-dev \
            libspa-0.2-dev libgbm-dev libdrm-dev libegl1-mesa-dev \
            libxkbcommon-dev libwayland-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

  audit:
    name: Audit Rust dependencies
    runs-on: ubuntu-24.04

    # RustSec advisory check for the Rust dependency graph (npm is covered by
    # Dependabot alerts). This job is intentionally blocking: a new advisory
    # should be triaged and either fixed by bumping the dependency or ignored
    # with an explicit, justified entry in `.cargo/audit.toml` so the reason is
    # captured in review. If an upstream advisory has no fix and no workaround,
    # unblock the branch temporarily with `continue-on-error: true` on this job
    # and open a tracking issue that links the advisory. Note that `stable` here
    # means "latest stable Rust" and is safe: the audit only reads Cargo.lock.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        working-directory: src-tauri
        run: cargo audit
