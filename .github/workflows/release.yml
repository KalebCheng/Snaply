name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to build and release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag and application versions
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          tag="$TAG_NAME"
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'

          if [[ ! "$tag" =~ $semver_re ]]; then
            echo "::error::Tag '$tag' is not a valid semantic version (for example 0.0.1 or 0.0.1-rc.1)."
            exit 1
          fi

          if [[ "$DISPATCHED" == "true" ]]; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            git checkout --detach "$tag"
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"

          for entry in \
            "package.json=$package_version" \
            "src-tauri/tauri.conf.json=$tauri_version" \
            "src-tauri/Cargo.toml=$cargo_version"; do
            file="${entry%%=*}"
            version="${entry#*=}"
            if [[ "$version" != "$tag" ]]; then
              echo "::error::$file has version '$version', but the tag is '$tag'."
              exit 1
            fi
          done

          if [[ "$tag" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          {
            echo "tag=$tag"
            echo "version=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $TAG is already published and cannot be rebuilt."
              exit 1
            fi
            echo "Reusing existing draft release $TAG."
            exit 0
          fi

          args=(
            --draft
            --verify-tag
            --title "Snaply $TAG"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG" "${args[@]}"

  frontend:
    name: Build frontend
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, create-release, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS Intel
            os: macos-latest
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            bundles: dmg
          - name: Windows x64
            os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Windows ARM64
            os: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libx11-dev libxcb1-dev libdbus-1-dev libpipewire-0.3-dev \
            libspa-0.2-dev libgbm-dev libdrm-dev libegl1-mesa-dev \
            libxkbcommon-dev libwayland-dev patchelf rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: Snaply ${{ needs.validate.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generateReleaseNotes: false
          releaseAssetNamePattern: Snaply_[version]_${{ matrix.platform }}_${{ matrix.arch }}[ext]
          args: --config src-tauri/tauri.ci.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish:
    name: Publish release
    needs: [validate, build]
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set final release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(
            git tag --sort=-version:refname |
              awk -v current="$TAG" '$0 != current { print; exit }'
          )"

          api_args=(--method POST "repos/$GH_REPO/releases/generate-notes" -f "tag_name=$TAG")
          if [[ -n "$previous_tag" ]]; then
            api_args+=(-f "previous_tag_name=$previous_tag")
          fi
          generated="$(gh api "${api_args[@]}" --jq '.body')"

          range="$TAG"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$TAG"
          fi
          commits="$(git log "$range" --no-merges --pretty=format:'- %s (`%h`)')"

          notes="$generated"
          if [[ -n "$commits" ]]; then
            notes+=$'\n\n## Commits\n\n'
            notes+="$commits"
          fi

          gh release edit "$TAG" --notes "$notes"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$PRERELEASE" == "false" ]]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false
          fi
